name: sqlbc01

services:
  db:
    image: postgres:16-alpine
    container_name: sqlbc01-db
    restart: unless-stopped
    environment:
      # admin est le superuser du cluster : il accède à TOUTES les bases
      # sans le moindre GRANT. Les utilisateurs par base sont créés par
      # init/10-databases.sh.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
      # Locale C délibérée, pour DEUX raisons :
      #  1. l'image alpine (musl libc) ne fournit pas fr_FR.UTF-8 ;
      #     initdb échouerait au premier démarrage ;
      #  2. SQLite trie en BINARY (octet par octet) par défaut. La locale C
      #     reproduit ce comportement -> les tris sont identiques à ceux de
      #     la plateforme. Une locale fr_FR introduirait un écart de plus.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 5433 côté hôte pour ne pas entrer en conflit avec un PostgreSQL
      # local (Django) qui écouterait déjà sur 5432.
      - "5433:5432"
    volumes:
      # Exécuté au TOUT PREMIER démarrage uniquement (volume vide).
      - ./init:/docker-entrypoint-initdb.d:ro
      # Les fichiers SQL des bases, lus par le script d'init ET par `make load`.
      - ./sql:/sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  # Interface web de consultation — optionnelle.
  # Démarrage : docker compose --profile ui up -d
  adminer:
    image: adminer:latest
    container_name: sqlbc01-adminer
    restart: unless-stopped
    profiles: ["ui"]
    ports:
      # 8081 côté hôte : le 8080 est souvent déjà pris par un serveur de dev
      # (uvicorn / runserver), même raison que le 5433 ci-dessus.
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
